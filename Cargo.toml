[package]
name = "f95-notify"
version = "2.0.0"
edition = "2021"
rust-version = "1.87"
description = "Desktop notifications for F95Zone alerts"
license = "GPL-2.0-only"
repository = "https://github.com/Official-Husko/f95-notify"
build = "build.rs"
default-run = "f95-notify"

[[bin]]
name = "f95-notify-login"
required-features = ["login"]

[features]
default = ["login"]
# Embedded webview login window, built as the separate `f95-notify-login` binary so the
# daemon never links a browser engine. Needs WebKitGTK on Linux and WebView2 on Windows.
# Build with `--no-default-features` to skip it and configure the cookie by hand.
login = ["dep:wry", "dep:tao"]

[dependencies]
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"], optional = true }
wry = { version = "0.57", default-features = false, features = ["os-webview"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4", default-features = false }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
png = "0.18"
# Compiles the Windows icon/version/manifest resources; only invoked for Windows targets.
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
